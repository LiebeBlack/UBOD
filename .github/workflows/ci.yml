name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain estable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy (warnings = errores)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests completos (incluye E2E mTLS)
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      - name: Subir binarios
        uses: actions/upload-artifact@v4
        with:
          name: vault-binaries-linux
          path: |
            target/release/vaultd
            target/release/vaultctl
            target/release/vault-gui
            target/release/vault-it
          if-no-files-found: error
