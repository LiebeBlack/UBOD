[workspace]
resolver = "2"
members = [
    "crates/vault-core",
    "crates/vault-crypto",
    "crates/vault-store",
    "crates/vault-fs",
    "crates/vault-admin",
    "crates/vault-index",
    "crates/vault-audit",
    "crates/vault-sync",
    "crates/vault-client",
    "crates/vault-webui",
    "crates/vault-roles",
    "crates/vault-crash",
    "crates/vault-gui",
    "bins/vaultd",
    "bins/vaultctl",
    "bins/vault-gui",
    "bins/vault-it",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# crates internos
vault-core = { path = "crates/vault-core" }
vault-crypto = { path = "crates/vault-crypto" }
vault-store = { path = "crates/vault-store" }
vault-fs = { path = "crates/vault-fs" }
vault-admin = { path = "crates/vault-admin" }
vault-index = { path = "crates/vault-index" }
vault-audit = { path = "crates/vault-audit" }
vault-sync = { path = "crates/vault-sync" }
vault-client = { path = "crates/vault-client" }
vault-webui = { path = "crates/vault-webui" }
vault-roles = { path = "crates/vault-roles" }
vault-crash = { path = "crates/vault-crash" }
vault-gui = { path = "crates/vault-gui" }

# runtime + red (sin la feature "parking_lot": usa windows-link/raw-dylib que
# rompe el enlazado de pruebas en windows-gnu; con std-locks funciona igual)
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
futures-util = "0.3"
mdns-sd = "0.13"

# TLS 1.3 mTLS con proveedor criptográfico RustCrypto (sin ring, sin C)
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
tokio-rustls = { version = "0.26", default-features = false, features = [] }

# X.509 / PKI
x509-cert = { version = "0.2", features = ["builder"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pem", "pkcs8", "std"] }
der = { version = "0.7", features = ["alloc", "derive", "oid"] }
spki = { version = "0.7", features = ["alloc", "pem"] }
const-oid = { version = "0.9", features = ["db"] }

# criptografía
blake3 = "1"
sha2 = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
getrandom = "0.2"
hex = "0.4"
base64 = "0.22"

# GUI de escritorio (egui: inmediata, liviana, sin X11 server propio)
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
    "accesskit",
] }

# serialización / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }

# logging / errores
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

# PDF / indexación (sin chrono/jiff: evitan raw-dylib incompatible con GNU ld)
lopdf = { version = "0.34", default-features = false, features = ["nom_parser", "rayon"] }

# Contenedores OOXML/ODF para el índice de texto: Word (.docx), Excel (.xlsx),
# PowerPoint (.pptx) y OpenDocument (.odt/.ods/.odp). Solo descompresión deflate
# en Rust puro (sin bzip2/zstd/aes ni dependencias nativas).
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
